	</head>

	<body>

        <div id="id_hiScores" class="cl_displayNone">
            <h3>~ Rangtábla ~</h3>
            <div id="id_hiScoreList"></div>
            <button id="id_bt_toggleHiScoresInner">Rendben</button>
        </div>

        <div id="id_description" class="cl_displayNone">
            <h3>~ Útmutató ~</h3>
            <p>[Space] [iránygombok]</p>
            <p></p>
            <button id="id_bt_toggleDescriptionInner">Ércsem</button>
        </div>

        <div id="id_gameContainer">
            <div id="id_gameStats">
                <table id="id_tb_gameStats">
                    <tbody>
                        <tr>
                            <td><span>Alma: <span id="id_appleCounter">0</span></span></td>
                            <td><span>Méreg: <span id="id_poisonCounter">0</span></span></td>
                            <td><span>Lépések: <span id="id_stepCounter">0</span></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="id_gameAreaContainer"></div>
            <div id="id_controlPanel">
                <button class="cl_gameButton" onclick="gamePlay()">Játék!</button>
                <button class="cl_gameButton" onclick="gamePause()">Sztoj</button>
                <button class="cl_gameButton" onclick="gameIdle()">Újrakezd</button>
                <button id="id_bt_toggleDescription" class="cl_gameButton">Útmutató</button>
                <button id="id_bt_toggleHiScores" class="cl_gameButton">Ranglista</button>
            </div>
<!--
> https://chatgpt.com/c/69ef1626-2a00-8330-9bdc-435f93ea48c3 : war

> https://unicode-explorer.com/list/arrows
-->
            <table id="id_tb_controlButtons">
                <tbody>
                    <tr>
                        <td></td>
                        <td><button class="cl_arrowButton" onmousedown="keyDirectionsHandler('ArrowUp')">&#x21E7;</button></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td><button class="cl_arrowButton" onmousedown="keyDirectionsHandler('ArrowLeft')">&#x21E6;</button></td>
                        <td><button class="cl_spaceButton" onmousedown="keySpaceHandler()">Space</button></td>
                        <td><button class="cl_arrowButton" onmousedown="keyDirectionsHandler('ArrowRight')">&#x21E8;</button></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><button class="cl_arrowButton" onmousedown="keyDirectionsHandler('ArrowDown')">&#x21E9;</button></td>
                        <td></td>
                    </tr>
                </tbody>
            </table> <!-- id_tb_controlButtons -->
        </div>

        <script type="text/javascript" src="code/javascript/constants.js"></script>
